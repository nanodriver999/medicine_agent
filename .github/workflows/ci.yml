name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m amo.cli run --input data/fixtures/smiles.csv --policy fixed --budget 3 --out /tmp/amo-ci-smoke
